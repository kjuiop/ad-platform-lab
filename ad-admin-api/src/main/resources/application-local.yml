spring:
  datasource:
    # 로컬 전용 — 운영 환경에서는 useSSL=true, allowPublicKeyRetrieval=false
    url: jdbc:mysql://localhost:3306/ad?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:ad_user}
    password: ${DB_PASSWORD:ad_password}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 500
        format_sql: false
